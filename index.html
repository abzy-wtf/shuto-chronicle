<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shutokō Chronicles">
  <meta name="application-name" content="Shutokō Chronicles">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121816">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Shutoko Chronicle</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <style>
    /* Layout concept: an expressway guide sign over a ledger. A sign-green band holds the mode tabs,
   a rail lists entities, and the main column reads like a logbook: a time grid first, then the story. */
    :root {
      --bg: #e7e5de;
      --panel: #f3f1ea;
      --ink: #17191c;
      --dim: #5b5f66;
      --line: #c9c6bb;
      --sign: #0d5a42;
      --signink: #f2f6f3;
      --amber: #a65a06;
      --focus: #0b57d0;
      --c-enter: #cfe4d4;
      --c-role: #f0dcae;
      --c-name: #d9d3ef;
      --c-team: #cde0e8;
      --c-else: #dedbd0;
      --f-disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      --f-body: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1113;
        --panel: #171a1e;
        --ink: #e7e5de;
        --dim: #9a9ea6;
        --line: #2a2e34;
        --sign: #0f6b4e;
        --signink: #f2f6f3;
        --amber: #f0a23b;
        --focus: #8ab4ff;
        --c-enter: #1f3a2b;
        --c-role: #463a1c;
        --c-name: #322d4d;
        --c-team: #1f3a46;
        --c-else: #22262b;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1113;
      --panel: #171a1e;
      --ink: #e7e5de;
      --dim: #9a9ea6;
      --line: #2a2e34;
      --sign: #0f6b4e;
      --signink: #f2f6f3;
      --amber: #f0a23b;
      --focus: #8ab4ff;
      --c-enter: #1f3a2b;
      --c-role: #463a1c;
      --c-name: #322d4d;
      --c-team: #1f3a46;
      --c-else: #22262b;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.6 var(--f-body);
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 0 40px
    }

    a {
      color: inherit
    }

    button {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px
    }

    .jp {
      font-family: var(--f-body)
    }

    .mono {
      font-family: var(--f-mono);
      font-size: 12px
    }

    .dim {
      color: var(--dim)
    }

    .jp-sub {
      font-size: 0.72em;
      font-weight: 400;
      color: var(--dim);
      margin-left: 6px;
      font-family: var(--f-body);
      letter-spacing: 0.02em
    }

    .view h2.title .jp-sub {
      font-size: 0.55em;
      font-weight: 400;
      color: var(--dim);
      margin-left: 10px;
      vertical-align: baseline;
      display: inline-block
    }

    .li-n .jp-sub {
      font-size: 11px;
      font-weight: 400;
      color: var(--dim);
      display: block;
      line-height: 1.2;
      margin-top: 2px
    }

    .en-sub {
      font-size: 0.85em;
      font-weight: 400;
      color: var(--dim);
      display: block;
      margin-top: 1px
    }

    .en-bio {
      font-style: italic;
      color: var(--ink);
      margin-top: 6px;
      line-height: 1.55;
      background: rgba(0, 0, 0, 0.03);
      padding: 8px 12px;
      border-left: 3px solid var(--amber);
      border-radius: 0 2px 2px 0
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .en-bio {
        background: rgba(255, 255, 255, 0.04)
      }
    }

    :root[data-theme="dark"] .en-bio {
      background: rgba(255, 255, 255, 0.04)
    }


    .lang-switcher {
      display: inline-flex;
      gap: 3px;
      align-items: center
    }

    .lang-btn {
      font: 600 11px/1.2 var(--f-mono);
      padding: 3px 7px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: all .15s
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15)
    }

    .lang-btn.active {
      background: var(--amber);
      color: #fff;
      border-color: var(--amber)
    }


    .lang-switcher {
      display: inline-flex;
      gap: 3px;
      align-items: center
    }

    .lang-btn {
      font: 600 11px/1.2 var(--f-mono);
      padding: 3px 7px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: all .15s
    }

    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15)
    }

    .lang-btn.active {
      background: var(--amber);
      color: #fff;
      border-color: var(--amber)
    }

    /* Taxonomy Badges & Chips */
    .tax-badge {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 6px 0 10px 0;
      flex-wrap: wrap
    }

    .tax-tag {
      font: 600 11px/1.2 var(--f-mono);
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .pillar-tag {
      border: 1px solid var(--amber);
      color: var(--amber);
      background: rgba(194, 106, 27, 0.08)
    }

    .motivator-tag {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: rgba(34, 85, 136, 0.08)
    }

    [data-theme="dark"] .pillar-tag {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(230, 138, 48, 0.12)
    }

    [data-theme="dark"] .motivator-tag {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12)
    }

    .chip.chip-pillar {
      border-color: rgba(194, 106, 27, 0.4);
      color: var(--amber)
    }

    .chip.chip-pillar[aria-pressed="true"] {
      background: var(--amber);
      color: #fff;
      border-color: var(--amber)
    }

    .chip.chip-motivator {
      border-color: rgba(34, 85, 136, 0.4);
      color: var(--blue)
    }

    .chip.chip-motivator[aria-pressed="true"] {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue)
    }

    [data-theme="dark"] .chip.chip-motivator {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4)
    }

    [data-theme="dark"] .chip.chip-motivator[aria-pressed="true"] {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7
    }

    /* sign band */
    .band {
      background: var(--sign);
      color: var(--signink);
      margin-inline: calc(-1*max(16px, env(safe-area-inset-left, 0px)));
      padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      border-bottom: 4px solid var(--amber)
    }

    .band-in {
      max-width: 1240px;
      margin: 0 auto
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 16px
    }

    .brand h1 {
      font: 700 30px/1 var(--f-disp);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin: 0
    }

    .brand .sub {
      font: 500 13px var(--f-body);
      opacity: .85
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 12px
    }

    .tab {
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      color: var(--signink);
      opacity: .75;
      font: 600 15px var(--f-disp);
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 8px 14px;
      cursor: pointer
    }

    .tab[aria-selected="true"] {
      opacity: 1;
      border-bottom-color: #fff
    }

    .tab:hover {
      opacity: 1
    }

    .theme-btn {
      margin-left: auto;
      font: 500 12px var(--f-mono);
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .45);
      color: var(--signink);
      padding: 4px 10px;
      border-radius: 2px;
      cursor: pointer;
      align-self: center
    }

    /* layout */
    .layout {
      max-width: 1240px;
      margin: 18px auto 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      align-items: start
    }

    .rail {
      position: sticky;
      top: 12px;
      max-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line)
    }

    .rail-top {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px
    }

    #q {
      width: 100%;
      font: 14px var(--f-body);
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 2px
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .chip {
      font: 500 11px var(--f-mono);
      border: 1px solid var(--line);
      background: transparent;
      padding: 3px 7px;
      border-radius: 2px;
      cursor: pointer;
      color: var(--dim)
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .chip b {
      font-weight: 500;
      opacity: .7
    }

    .count {
      font: 11px var(--f-mono);
      color: var(--dim)
    }

    .list {
      overflow: auto;
      flex: 1;
      min-height: 0;
      list-style: none;
      margin: 0;
      padding: 0
    }

    .list li button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      cursor: pointer
    }

    .list li button:hover {
      background: var(--bg)
    }

    .list li button[aria-current="true"] {
      background: var(--bg);
      box-shadow: inset 3px 0 0 var(--amber)
    }

    .li-n {
      display: block;
      font-weight: 500;
      line-height: 1.3
    }

    .li-s {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font: 11px var(--f-mono);
      color: var(--dim)
    }

    /* main view */
    .view {
      min-width: 0
    }

    .eyebrow {
      font: 600 12px var(--f-disp);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--amber);
      margin: 0 0 4px
    }

    .view h2.title {
      font: 700 38px/1.1 var(--f-body);
      margin: 0;
      text-wrap: balance
    }

    .view .aka {
      margin: 4px 0 0;
      color: var(--dim)
    }

    .metaline {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      margin: 10px 0 0;
      font: 12px var(--f-mono);
      color: var(--dim)
    }

    h3.sec {
      font: 600 14px var(--f-disp);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin: 30px 0 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--ink);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline
    }

    h3.sec small {
      font: 400 11px var(--f-mono);
      letter-spacing: 0;
      text-transform: none;
      color: var(--dim)
    }

    .scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--panel)
    }

    /* time grid */
    table.tg {
      border-collapse: collapse;
      width: 100%;
      min-width: 1250px;
      table-layout: fixed
    }

    .tg th,
    .tg td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      vertical-align: top;
      text-align: left;
      font-weight: 400
    }

    .tg thead th {
      background: var(--bg);
      font: 600 12px var(--f-disp);
      letter-spacing: .1em;
      text-transform: uppercase;
      position: sticky;
      top: 0
    }

    .tg thead th small {
      display: block;
      font: 400 11px var(--f-mono);
      letter-spacing: 0;
      color: var(--dim)
    }

    .tg th.rowh {
      width: 150px;
      background: var(--bg);
      position: sticky;
      left: 0;
      z-index: 1
    }

    .tg th.rowh .n {
      display: block;
      font-weight: 500
    }

    .tg th.rowh .e {
      display: block;
      font: 11px var(--f-mono);
      color: var(--dim);
      overflow-wrap: anywhere
    }

    .cell {
      display: block;
      font-size: 13px;
      line-height: 1.35
    }

    .cell .t {
      font-weight: 500;
      overflow-wrap: anywhere
    }

    .cell .m {
      display: block;
      font: 11px var(--f-mono);
      color: var(--dim);
      margin-top: 2px;
      overflow-wrap: anywhere
    }

    .jp-sub {
      font-weight: 400;
      opacity: .7;
      font-size: .85em
    }

    h2.title .jp-sub {
      font-size: .6em;
      opacity: .65;
      font-weight: 400;
      margin-left: 8px
    }

    .rec-title {
      font-weight: 600
    }

    .en-sub {
      font: 11px var(--f-mono);
      color: var(--dim);
      display: block;
      margin-top: 2px
    }

    .k-enter {
      background: var(--c-enter)
    }

    .k-role {
      background: var(--c-role)
    }

    .k-name {
      background: var(--c-name)
    }

    .k-team {
      background: var(--c-team)
    }

    .k-else {
      background: var(--c-else);
      color: var(--dim)
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin: 8px 0 0;
      font: 11px var(--f-mono);
      color: var(--dim)
    }

    .legend i {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 1px solid var(--line);
      vertical-align: -2px;
      margin-right: 5px
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 11px var(--f-mono)
    }

    .bar i {
      display: block;
      height: 8px;
      background: var(--sign);
      min-width: 2px
    }

    .sizes td {
      padding: 5px 8px
    }

    /* story */
    .story {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--amber);
      padding: 6px 20px 14px
    }

    .story p {
      max-width: 68ch;
      margin: 12px 0
    }

    .story .tags {
      font: 11px var(--f-mono);
      color: var(--dim);
      margin-top: 14px
    }

    .ref {
      font: 11px var(--f-mono);
      color: var(--dim);
      white-space: nowrap
    }

    .q {
      display: block;
      margin: 8px 0 8px;
      padding-left: 12px;
      border-left: 2px solid var(--line);
      max-width: 68ch
    }

    .q .ja {
      display: block
    }

    .q .en {
      display: block;
      color: var(--dim);
      font-size: 13px;
      margin-top: 2px
    }

    .auto {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 8px 16px
    }

    .log {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .log li {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--line)
    }

    .log li:last-child {
      border-bottom: 0
    }

    .log .w {
      font: 12px var(--f-mono);
      color: var(--dim)
    }

    .arrow {
      color: var(--amber)
    }

    .linkbtn {
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--amber);
      text-underline-offset: 3px;
      cursor: pointer;
      text-align: left
    }

    .holders {
      display: grid;
      gap: 10px
    }

    .holder {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 14px
    }

    /* records */
    details.rec {
      border: 1px solid var(--line);
      background: var(--panel);
      margin: 0 0 6px
    }

    details.rec>summary {
      cursor: pointer;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 14px;
      align-items: baseline;
      list-style: none
    }

    details.rec>summary::-webkit-details-marker {
      display: none
    }

    details.rec>summary::before {
      content: "+";
      font: 12px var(--f-mono);
      color: var(--amber);
      width: 10px
    }

    details.rec[open]>summary::before {
      content: "\2212"
    }

    .rec-body {
      padding: 2px 14px 12px 34px
    }

    .rec-body p {
      margin: 6px 0;
      max-width: 70ch
    }

    .rec-body .en {
      color: var(--dim);
      font-size: 13px
    }

    .rec-head {
      font: 11px var(--f-mono);
      color: var(--dim)
    }

    .rec-rumor {
      font-size: 12px;
      margin: 4px 0 6px;
      color: var(--amber);
      line-height: 1.4;
    }

    .rec-rumor-tag {
      display: inline-block;
      font: 10px var(--f-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border: 1px solid currentColor;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: 1px;
    }

    .rec-motto {
      font-size: 12px;
      margin: 3px 0 5px;
      color: var(--ink);
      line-height: 1.4;
    }

    .rec-motto-tag {
      display: inline-block;
      font: 10px var(--f-mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 1px 5px;
      border: 1px solid var(--dim);
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: 1px;
      color: var(--dim);
    }

    .rr {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
      margin-top: 8px
    }

    .rr:first-child {
      border-top: 0;
      margin-top: 0;
      padding-top: 0
    }

    /* home */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 12px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      display: block
    }

    .card:hover {
      border-color: var(--ink)
    }

    .card .k {
      font: 600 11px var(--f-disp);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--amber)
    }

    .card .h {
      display: block;
      font: 700 18px/1.25 var(--f-body);
      margin: 4px 0
    }

    .card .d {
      display: block;
      color: var(--dim);
      font-size: 13px
    }

    .intro {
      max-width: 70ch
    }

    .back {
      display: none
    }

    .seatlist {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    @media (max-width:860px) {
      .has-sel .rail {
        display: none
      }

      .back {
        display: inline-block
      }

      .layout {
